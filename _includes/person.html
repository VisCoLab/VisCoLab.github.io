{%- assign p = include.person -%}
<li class="person">
  <span class="person-photo">
    {%- if p.photo -%}
      <img src="{{ '/images/people/' | append: p.photo | relative_url }}" alt="{{ p.name }}" loading="lazy" width="240" height="240">
    {%- else -%}
      <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="25" r="11"/><path d="M12 58c1.5-11 9.5-18 20-18s18.5 7 20 18z"/></svg>
    {%- endif -%}
  </span>
  <span class="person-name">{% if p.url %}<a href="{{ p.url }}">{{ p.name }}</a>{% else %}{{ p.name }}{% endif %}</span>
  {%- if p.note %}<span class="person-note">{{ p.note }}</span>{% endif %}
</li>
