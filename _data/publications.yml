# Lab publications, newest first. publications.html groups them by `year`;
# the home page shows the `featured` ones (up to six) as image cards.
# Metadata verified against Crossref / the publisher on 2026-10-14.
#
# Per paper:
#   id          short slug, also the anchor (publications.html#<id>)
#   title       official title
#   authors     official author list, in the publisher's order; lab members are
#               bolded automatically (see _data/people.yml)
#   venue       short label, e.g. "SIGGRAPH 2026", "ECCV 2026", "NeurIPS 2026"
#   venue_full  optional: journal or track, e.g. "ACM Transactions on Graphics"
#   status      optional: "to appear" until the paper is out
#   year        publication year
#   image       16:9 teaser in images/projects/, at least 800 px wide (optional)
#   clip        optional 6 s muted loop, videos/<id>.mp4 (640 x 360 H.264) with a
#               poster frame videos/<id>.jpg; replaces `image` on Publications
#   highlight   optional one-line award or highlight; highlight_url links it
#   featured    true to show it as a card on the home page (the first three)
#   hero        true to rotate its image at the top of the home page (four at most;
#               wide renders at least 1400 px across)
#   themes      research.html themes: vision, synthetic, natural, formal
#   links       any of project, paper (DOI), arxiv, code, data, video

