# Lab members. people.html renders the groups in this order; within a group,
# members appear in the order listed here.
#
# Per member:
#   name     shown on the People page; also bolded wherever it appears in a
#            publication's author list
#   aliases  other spellings used in author lists (optional)
#   group    one of the group ids below
#   photo    file in images/people/ — square, at least 400 x 400 px (optional;
#            without one a neutral silhouette is shown)
#   url      personal or university page (optional)
#   note     one short line under the name (optional)

groups:
  - { id: head, title: Lab Head }
  - { id: postdoc, title: Postdoctoral Researchers }
  - { id: phd, title: PhD Students }
  - { id: msc, title: MSc Students }
  - { id: assistant, title: Research Assistants }
  - { id: alumni, title: Alumni }

